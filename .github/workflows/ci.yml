name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatoros
          POSTGRES_PASSWORD: creatoros_password
          POSTGRES_DB: creatoros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatoros -d creatoros"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://creatoros:creatoros_password@127.0.0.1:5432/creatoros
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        run: ruff check app tests alembic main.py

      - name: Type-check backend
        run: mypy app alembic main.py

      - name: Run backend tests
        run: pytest -q

      - name: Apply and validate migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Audit dashboard dependencies
        run: npm audit --audit-level=high

      - name: Lint dashboard
        run: npm run lint

      - name: Type-check dashboard
        run: npx tsc --noEmit --incremental false

      - name: Build dashboard
        run: npm run build
